[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "network-automation"
version = "0.1.0"
description = "Safe, vendor-neutral router automation gateway foundation"
requires-python = ">=3.10,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic>=2.7,<3.0",
    "typing-extensions>=4.8,<5.0",
    "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
]
device = [
    "httpx>=0.27,<1.0",
    "junos-eznc>=2.7,<3.0",
    "ncclient>=0.6.15,<1.0",
    "netmiko>=4.4,<5.0",
    "paramiko>=3.4,<4.0",
    "pysnmp>=7.1,<8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
